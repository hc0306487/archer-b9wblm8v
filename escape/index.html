<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="잠긴 저택">
<meta name="theme-color" content="#16131c">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>잠긴 저택</title>
<style>
:root{
  --bg:#16131c; --panel:#221d2b; --line:rgba(255,240,220,.14);
  --ink:#f6eee3; --dim:#b3a9b8; --gold:#f0c264; --mint:#6fd6b4; --red:#ff7272;
  --font:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}

#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:8px 12px;gap:8px}
#roomName{text-align:center;font-weight:800;font-size:18px;letter-spacing:.02em}
#roomName small{display:block;font-size:12px;font-weight:500;color:var(--dim)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
#wrap{display:grid;place-items:center;min-height:0;padding:0 12px}
#stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#000}
#scene{position:absolute;inset:0}
#scene > *{position:absolute}
#inv{display:flex;justify-content:center;gap:8px;padding:10px 12px 12px}
.slot{width:56px;height:56px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:30px;transition:transform .12s}
.slot.sel{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(240,194,100,.25);transform:translateY(-4px)}
#toast{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);max-width:88%;background:rgba(15,12,20,.88);border:1px solid var(--line);
  padding:9px 14px;border-radius:12px;font-size:15px;line-height:1.4;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
#toast.on{opacity:1}

/* screens */
.screen{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(10,8,14,.9);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
.card{width:100%;max-width:400px;display:grid;gap:16px;text-align:center}
h1{margin:0;font-size:46px;line-height:1.05;color:var(--gold);letter-spacing:-.02em}
h2{margin:0;font-size:28px}
p{margin:0;line-height:1.6;color:var(--dim)}
.btn{font-weight:800;font-size:19px;border-radius:999px;padding:14px 22px;background:var(--gold);color:#2b1d05;box-shadow:0 5px 0 #a8822f}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8822f}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid var(--line);font-size:16px;padding:12px 18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv{aspect-ratio:1;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:22px;display:grid;place-items:center;position:relative}
.lv.done{background:#2c3a33;border-color:rgba(111,214,180,.5);color:var(--mint)}
.lv.done::after{content:"✓";position:absolute;right:6px;top:3px;font-size:12px}
.lv.locked{opacity:.35}
.hintbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:grid;gap:8px}
.hintbox p{color:var(--ink)}
.hintbox p b{color:var(--gold);margin-right:6px}

/* zoom panel */
#zoom{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:rgba(6,5,10,.78);padding:16px}
#zoomPanel{position:relative;width:min(92vw,380px);background:#2a2433;border:1px solid var(--line);border-radius:20px;padding:22px 18px 18px;display:grid;gap:14px;justify-items:center}
#zoomClose{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:12px;font-size:20px;color:var(--dim)}
.ztitle{font-weight:800;font-size:17px;color:var(--dim)}

/* common room parts */
.wall{left:0;top:0;width:100%;height:72%}
.floor{left:0;top:72%;width:100%;height:28%}
.base{left:0;top:71%;width:100%;height:2%;background:rgba(0,0,0,.35)}
.door{border-radius:6px 6px 0 0;background:linear-gradient(90deg,#6b4325,#86552f 50%,#6b4325);border:.35em solid #3f2814;border-bottom:0;
  box-shadow:inset 0 0 0 .25em rgba(0,0,0,.15);transition:transform .5s;transform-origin:left center;perspective:600px}
.door::before,.door::after{content:"";position:absolute;left:14%;right:14%;border:.18em solid rgba(0,0,0,.22);border-radius:4px}
.door::before{top:7%;height:36%}
.door::after{top:52%;height:40%}
.door .knob{position:absolute;right:9%;top:52%;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a6,#c7962e);box-shadow:0 .1em .2em rgba(0,0,0,.5)}
.door .lock{position:absolute;right:4%;top:60%;font-size:1.1em}
.door.open{background:#0a0807;border-color:#2a1b0e}
.door.open::before,.door.open::after,.door.open .knob,.door.open .lock{display:none}
.door.open .light{display:block}
.door .light{display:none;position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(255,236,180,.9),rgba(255,200,120,.25) 60%,transparent 80%);animation:glow 1.6s infinite alternate}
@keyframes glow{to{opacity:.65}}
.obj{display:grid;place-items:center;line-height:1}
.emo{font-size:2.4em;line-height:1;display:grid;place-items:center}
.tapme{cursor:pointer}
.frame{background:#f2e7d0;border:.4em solid #8b5e34;box-shadow:0 .2em .4em rgba(0,0,0,.4);display:grid;place-items:center}
.note{background:#fff8e3;color:#3b2c1d;border-radius:3px;box-shadow:0 .15em .3em rgba(0,0,0,.4);display:grid;place-items:center;font-weight:800;transform:rotate(-4deg)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}

/* keypad / widgets */
.display{font-variant-numeric:tabular-nums;font-size:30px;letter-spacing:.4em;padding:8px 6px 8px 18px;border-radius:10px;background:#121016;border:1px solid var(--line);min-width:180px;text-align:center;color:var(--mint);min-height:52px}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.key{height:54px;border-radius:12px;background:#3a3345;font-size:22px;font-weight:700;box-shadow:0 3px 0 #1d1924}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #1d1924}
.dials{display:flex;gap:10px}
.dial{display:grid;gap:4px;justify-items:center}
.dial button{width:56px;height:36px;border-radius:10px;background:#3a3345;font-size:16px}
.dial .num{width:56px;height:62px;border-radius:10px;background:#121016;border:1px solid var(--line);display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--gold)}
.dot{width:16px;height:16px;border-radius:50%}
.slide{display:grid;grid-template-columns:repeat(3,82px);grid-template-rows:repeat(3,82px);gap:4px;background:#121016;padding:4px;border-radius:12px}
.tile{border-radius:10px;background:linear-gradient(#d9a45a,#b07a35);color:#3a2408;font-size:30px;font-weight:800;display:grid;place-items:center;transition:transform .1s}
.tile.empty{background:transparent}
.lo{display:grid;grid-template-columns:repeat(3,84px);gap:8px}
.lo button{height:84px;border-radius:14px;background:#2b2735;border:2px solid #3a3445;transition:background .15s}
.lo button.on{background:radial-gradient(circle,#fff6c9,#f0c264);border-color:#ffe39a;box-shadow:0 0 18px rgba(240,194,100,.7)}
.nav{position:absolute;top:44%;width:2.1em;height:3em;border-radius:.6em;background:rgba(15,12,20,.55);color:#fff;font-size:1.3em;line-height:1;z-index:80;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18)}
.nav:active{background:rgba(240,194,100,.5)}
.viewlab{position:absolute;left:50%;top:1%;transform:translateX(-50%);z-index:80;font-size:.55em;color:#fff;background:rgba(15,12,20,.55);padding:.25em .8em;border-radius:1em;white-space:nowrap;pointer-events:none}
.viewlab span{letter-spacing:.15em;color:var(--gold);margin-left:.3em}
#inv{flex-wrap:wrap}
.slot{width:50px;height:50px;font-size:26px}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="iconbtn" id="menuBtn" aria-label="메뉴">☰</button>
    <div id="roomName">방 1</div>
    <button class="iconbtn" id="hintBtn" aria-label="힌트">💡</button>
  </header>
  <main id="wrap"><div id="stage"><div id="scene"></div><div id="toast"></div></div></main>
  <footer id="inv"></footer>
</div>

<div id="zoom" hidden><div id="zoomPanel"><button id="zoomClose" aria-label="닫기">✕</button><div id="zoomBody" style="display:grid;gap:14px;justify-items:center;width:100%"></div></div></div>

<div class="screen" id="titleScreen">
  <div class="card">
    <div style="font-size:64px">🏚️🗝️</div>
    <h1>잠긴 저택</h1>
    <p>저택의 방 열두 개가 차례로 잠겨 있어요.<br>방마다 네 벽을 둘러보며 퍼즐 일곱 개 이상을 풀어야 나갈 수 있어요.</p>
    <div class="hintbox">
      <p><b>둘러보기</b>화면 양옆의 ‹ › 로 벽을 넘겨요</p>
      <p><b>살펴보기</b>방 안의 물건을 눌러요</p>
      <p><b>아이템</b>아래 칸의 물건을 눌러 고른 뒤, 쓸 곳을 눌러요</p>
      <p><b>조합</b>아이템을 고른 채로 다른 아이템을 누르면 합쳐져요</p>
      <p><b>힌트</b>💡 힌트는 방에 들어온 뒤 2분마다 하나씩 열려요</p>
      <p><b>저장</b>방 안에서 풀어 둔 것도 저절로 저장돼요</p>
    </div>
    <button class="btn" id="playBtn">시작하기</button>
    <button class="btn ghost" id="selectBtn">방 고르기</button>
  </div>
</div>

<div class="screen" id="selectScreen" hidden>
  <div class="card">
    <h2>방 고르기</h2>
    <div class="grid" id="lvGrid"></div>
    <button class="btn ghost" id="selBack">돌아가기</button>
  </div>
</div>

<div class="screen" id="clearScreen" hidden>
  <div class="card">
    <div style="font-size:64px" id="clearEmo">🎉</div>
    <h2 id="clearTitle">탈출 성공!</h2>
    <p id="clearText"></p>
    <button class="btn" id="nextBtn">다음 방으로</button>
    <button class="btn ghost" id="clearMenu">방 고르기</button>
  </div>
</div>

<div class="screen" id="hintScreen" hidden>
  <div class="card">
    <h2>힌트</h2>
    <div class="hintbox" id="hintList"></div>
    <button class="btn" id="moreHint">힌트 하나 더 보기</button>
    <button class="btn ghost" id="hintClose">닫기</button>
  </div>
</div>

<div class="screen" id="menuScreen" hidden>
  <div class="card">
    <h2>잠깐 멈춤</h2>
    <button class="btn" id="resumeBtn">계속하기</button>
    <button class="btn ghost" id="restartBtn">이 방 처음부터</button>
    <button class="btn ghost" id="menuSelect">방 고르기</button>
    <button class="btn ghost" id="soundBtn">소리 끄기</button>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
let scene = $('scene'); const stage = $('stage');

/* ---------- save ---------- */
const SAVE_KEY = 'mansion-save';
let save = { cleared: [], sound: true, prog: null };
try { save = Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- sound ---------- */
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function tone(f, dur = .12, type = 'sine', vol = .15, when = 0) {
  if (!save.sound) return; const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
  const t = a.currentTime + when; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  tap: () => tone(520, .05, 'triangle', .08),
  get: () => { tone(660, .1, 'triangle'); tone(990, .15, 'triangle', .15, .08); },
  bad: () => tone(160, .18, 'square', .07),
  unlock: () => { tone(523, .1, 'triangle'); tone(659, .1, 'triangle', .15, .09); tone(784, .22, 'triangle', .15, .18); },
  door: () => { tone(220, .3, 'sawtooth', .05); tone(330, .4, 'sine', .1, .1); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .14, i * .12)),
};

/* ---------- layout ---------- */
function fit() {
  const w = $('wrap').clientWidth - 24, h = $('wrap').clientHeight - 8;
  const sw = Math.min(w, h * 3 / 4, 520);
  stage.style.width = sw + 'px'; stage.style.height = sw * 4 / 3 + 'px'; stage.style.fontSize = (sw / 22) + 'px';
}
addEventListener('resize', fit);
let toastT = 0;
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2400); }

/* ---------- items ---------- */
const ITEMS = {
  sc: ['✂️', '가위'], skey: ['🗝️', '작은 열쇠'], fl0: ['🔦', '손전등 (건전지 없음)'], bat: ['🔋', '건전지'], fl: ['🔦', '손전등'],
  drv: ['🪛', '드라이버'], kA: ['🔑', '열쇠 조각 (머리)'], kB: ['🦯', '열쇠 조각 (몸통)'], key: ['🔑', '열쇠'],
  match: ['🔥', '성냥'], gear: ['⚙️', '톱니바퀴'], ham: ['🔨', '망치'], card: ['💳', '카드키'],
  mag: ['🧲', '자석'], str: ['🧵', '실타래'], rod: ['🎣', '자석 낚싯줄'], fuse: ['🔌', '퓨즈'], glove: ['🧤', '장갑'], valve: ['🔧', '밸브 손잡이'],
  pick: ['⛏️', '곡괭이'], mirror: ['🪞', '손거울'], handle: ['🔩', '문 손잡이'],
  rec: ['💿', '레코드판'], needle: ['📍', '바늘'], fork: ['🎵', '소리굽쇠'],
  lens: ['🔍', '렌즈'], w7: ['🥌', '2kg 추'], gkey: ['🗝️', '금빛 열쇠'],
};
let inv = [], sel = null;
function drawInv() {
  const box = $('inv'); box.innerHTML = '';
  for (let i = 0; i < Math.max(6, inv.length); i++) {
    const id = inv[i]; const b = document.createElement('button'); b.className = 'slot' + (id && sel === id ? ' sel' : '');
    if (id) {
      b.textContent = ITEMS[id][0]; b.setAttribute('aria-label', ITEMS[id][1]);
      b.onclick = () => { sfx.tap(); if (sel && sel !== id && tryCombine(sel, id)) return; sel = sel === id ? null : id; if (sel) toast(ITEMS[id][1] + ' 을(를) 골랐어요.'); drawInv(); };
    }
    box.appendChild(b);
  }
}
function tryCombine(a, b) {
  const c = ROOMS[cur].combos || {}, r = c[a + '+' + b] || c[b + '+' + a];
  if (!r) { return false; }
  inv = inv.filter(i => i !== a && i !== b); sel = null; inv.push(r);
  sfx.get(); toast('두 물건을 합쳐서 ' + ITEMS[r][1] + ' 을(를) 만들었어요!'); saveProg(); drawInv(); return true;
}
function give(id) { if (!inv.includes(id)) inv.push(id); sfx.get(); toast(ITEMS[id][1] + ' 을(를) 얻었어요!'); saveProg(); drawInv(); }
function take(id) { inv = inv.filter(i => i !== id); if (sel === id) sel = null; saveProg(); drawInv(); }
const has = id => sel === id;

/* ---------- zoom ---------- */
function zoom(title, build) {
  const body = $('zoomBody'); body.innerHTML = '';
  if (title) body.appendChild(h('div', 'ztitle', title));
  build(body); $('zoom').hidden = false;
}
function closeZoom() { $('zoom').hidden = true; }
$('zoomClose').onclick = closeZoom;
$('zoom').addEventListener('click', e => { if (e.target.id === 'zoom') closeZoom(); });

/* ---------- dom helpers ---------- */
function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function put(cls, x, y, w, hh, html, style) {
  const e = h('div', cls, html); Object.assign(e.style, { left: x + '%', top: y + '%', width: w + '%', height: hh + '%' }, style || {});
  scene.appendChild(e); return e;
}
function on(e, fn) { e.classList.add('tapme'); e.addEventListener('click', ev => { ev.stopPropagation(); fn(ev); }); return e; }
function O(x, y, w, hh, html, style, fn) { const e = put('obj', x, y, w, hh, html, style); if (fn) on(e, fn); return e; }
function EM(x, y, w, hh, emo, size, fn, style) { return O(x, y, w, hh, '<span class="emo" style="font-size:' + size + 'em">' + emo + '</span>', style, fn); }
function NOTE(x, y, w, hh, emo, fn) { const e = put('note', x, y, w, hh, emo, { fontSize: '1.2em' }); on(e, fn); return e; }
function shake(e) { e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }
const paper = (inner, extra) => '<div style="background:#fff8e3;color:#3b2c1d;padding:16px 20px;border-radius:8px;font-weight:800;line-height:1.7;' + (extra || '') + '">' + inner + '</div>';
const look = (title, html) => zoom(title, b => { b.insertAdjacentHTML('beforeend', html); });

/* ---------- room state ---------- */
let cur = 0, view = 0, F = {}, startTime = 0, door = null;
const VIEW_NAMES = ['정면', '오른쪽 벽', '뒤쪽 벽', '왼쪽 벽'];
function saveProg() { save.prog = { room: cur, view, F, inv, t: Date.now() - startTime }; persist(); }
function set(k, v = 1) { F[k] = v; saveProg(); render(); }
function render() {
  const ns = document.createElement('div'); ns.id = 'scene'; scene.replaceWith(ns); scene = ns;
  const R = ROOMS[cur], th = R.theme[view] || R.theme[0];
  put('wall', 0, 0, 100, 72, '', { background: th[0] });
  put('floor', 0, 72, 100, 28, '', { background: th[1] });
  put('base', 0, 71, 100, 2);
  door = null;
  R.views[view]();
  // darkness
  if (R.dark && R.dark()) {
    const d = O(0, 0, 100, 100, '', { background: '#000', pointerEvents: 'none', zIndex: 50 });
    const light = (x, y) => d.style.background = 'radial-gradient(circle at ' + x + 'px ' + y + 'px, transparent 0, transparent 3em, #000 5.2em)';
    const pos = e => { const r = stage.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return [p.clientX - r.left, p.clientY - r.top]; };
    if (F.on) { light(-999, -999); const mv = e => light(...pos(e)); scene.addEventListener('pointerdown', mv); scene.addEventListener('pointermove', mv); scene.addEventListener('touchmove', mv, { passive: true }); }
    scene.addEventListener('click', e => { if (!F.on && sel === 'fl') { F.on = 1; saveProg(); sfx.tap(); toast('손전등을 켰어요. 화면을 누르거나 끌어서 비춰 봐요.'); render(); } else if (!F.on && sel === 'fl0') toast('딸깍… 켜지지 않아요.'); });
  }
  // navigation

    const wrap = h('div', ''); wrap.style.cssText = 'display:flex;gap:10px'; body.appendChild(wrap);
    const mk = (arr, click) => { const g = h('div', ''); g.style.cssText = 'display:grid;grid-template-columns:repeat(3,44px);gap:2px;background:#f7f1e3;padding:6px;border-radius:8px;border:4px solid #8b5e34'; arr.forEach((x, i) => { const c = h('button', '', x); c.style.cssText = 'height:44px;font-size:26px;border-radius:6px'; if (click) c.onclick = () => click(i, c); g.appendChild(c); }); wrap.appendChild(g); };
    let found = new Set(); const st = h('p', '', '0 / 3');
    mk(base, null);
    mk(alt, (i, c) => { if (base[i] !== alt[i]) { if (!found.has(i)) { found.add(i); sfx.get(); c.style.boxShadow = '0 0 0 3px #e05252'; st.textContent = found.size + ' / 3'; if (found.size === 3) setTimeout(() => { closeZoom(); done(); }, 400); } } else { sfx.bad(); shake(c); } });
    body.appendChild(st);
  });
}
function wMix(done) {
  zoom('물감 두 가지를 골라 섞어요', body => {
    const prim = [['빨강', '#e05252'], ['노랑', '#e8c33c'], ['파랑', '#4a8be0']];
    const targets = [['주황', '#f39c12', [0, 1]], ['초록', '#4fbf6f', [1, 2]], ['보라', '#8e44ad', [0, 2]]];
    let ti = 0, pick = [];
    const tgt = h('div', ''); body.appendChild(tgt);
    const row = h('div', ''); row.style.cssText = 'display:flex;gap:12px'; body.appendChild(row);
    const st = h('p', ''); body.appendChild(st);
    const draw = () => { tgt.innerHTML = '<div style="display:flex;gap:10px;align-items:center"><span style="color:var(--dim)">' + (ti + 1) + '/3 만들 색</span><span style="width:56px;height:56px;border-radius:50%;background:#555;border:3px dashed #888;display:grid;place-items:center;font-size:12px">?</span><b>' + targets[ti][0] + '</b></div>'; st.textContent = '고른 물감: ' + (pick.map(p => prim[p][0]).join(' + ') || '없음'); };
    prim.forEach(([nm, c], i) => { const b = h('button', '', ''); b.style.cssText = 'width:62px;height:62px;border-radius:50%;background:' + c + ';box-shadow:inset 0 -4px rgba(0,0,0,.3)'; b.setAttribute('aria-label', nm);
      b.onclick = () => { sfx.tap(); if (pick.includes(i)) return; pick.push(i); draw(); if (pick.length === 2) { const ok = pick.slice().sort().join() === targets[ti][2].join(); setTimeout(() => { if (ok) { sfx.get(); ti++; pick = []; if (ti === 3) { closeZoom(); done(); return; } } else { sfx.bad(); pick = []; st.textContent = '색이 탁해졌어요. 다시 골라요.'; return; } draw(); }, 300); } };
      row.appendChild(b); });
    draw();
  });
}

Object.assign(ITEMS, {
  ice: ['🧊', '얼음 덩어리'], knob: ['🎛️', '가스레인지 손잡이'], ring: ['💍', '반지'], oglove: ['🧤', '오븐 장갑'],
  shear: ['✂️', '전지가위'], can0: ['🚿', '빈 물뿌리개'], can1: ['💧', '물이 든 물뿌리개'], coin: ['🪙', '동전'], seed: ['🌱', '씨앗'],
  wind: ['🌀', '태엽 손잡이'], star: ['⭐', '별 스티커'], crayon: ['🖍️', '크레파스'],
  brush: ['🖌️', '붓'], knife: ['🔪', '조각칼'], bulb: ['💡', '영사기 전구'], lever: ['🎚️', '레버'], oil: ['🛢️', '기름통'],
});

/* ---------- flow ---------- */
function startRoom(i, resume) {
  cur = i; sel = null; hintsShown = 1;
  if (resume && save.prog && save.prog.room === i) { F = save.prog.F || {}; inv = save.prog.inv || []; view = save.prog.view || 0; startTime = Date.now() - (save.prog.t || 0); }
  else { F = {}; inv = []; view = 0; startTime = Date.now(); }
  $('roomName').innerHTML = '방 ' + (i + 1) + ' <small>' + ROOMS[i].name + '</small>';
  ['titleScreen', 'selectScreen', 'clearScreen', 'menuScreen', 'hintScreen'].forEach(s => $(s).hidden = true);
  closeZoom(); fit(); render(); drawInv(); $('toast').classList.remove('on'); saveProg();
}
function cleared() {
  if (!save.cleared.includes(cur)) save.cleared.push(cur);
  const sec = Math.round((Date.now() - startTime) / 1000), t = sec >= 60 ? Math.floor(sec / 60) + '분 ' + (sec % 60) + '초' : sec + '초';
  const last = cur === ROOMS.length - 1;
  save.prog = null; persist(); sfx.win();
  $('clearEmo').textContent = last ? '🏆' : '🎉';
  $('clearTitle').textContent = last ? '저택을 탈출했어요!' : '방 ' + (cur + 1) + ' 탈출!';
  $('clearText').textContent = (last ? '열두 개의 방을 모두 빠져나왔어요. 정말 대단해요! ' : '') + '걸린 시간 ' + t;
  $('nextBtn').textContent = last ? '처음 방부터 다시' : '다음 방으로';
  $('clearScreen').hidden = false;
}
$('nextBtn').onclick = () => startRoom(cur === ROOMS.length - 1 ? 0 : cur + 1);
function showSelect() {
  const g = $('lvGrid'); g.innerHTML = '';
  const maxOpen = Math.max(0, ...save.cleared.map(c => c + 1));
  ROOMS.forEach((r, i) => {
    const done = save.cleared.includes(i), open = i <= maxOpen, prog = save.prog && save.prog.room === i;
    const b = h('button', 'lv' + (done ? ' done' : '') + (open ? '' : ' locked'), open ? (i + 1) + (prog ? '<small style="position:absolute;bottom:4px;font-size:10px;color:var(--gold)">진행 중</small>' : '') : '🔒');
    if (open) b.onclick = () => startRoom(i, true);
    g.appendChild(b);
  });
  ['titleScreen', 'clearScreen', 'menuScreen'].forEach(s => $(s).hidden = true);
  $('selectScreen').hidden = false;
}
function nextRoom() { if (save.prog && save.prog.room < ROOMS.length) return save.prog.room; for (let i = 0; i < ROOMS.length; i++) if (!save.cleared.includes(i)) return i; return 0; }
const n0 = nextRoom();
$('playBtn').textContent = (save.cleared.length || save.prog) ? '이어하기 (방 ' + (n0 + 1) + ')' : '시작하기';
$('playBtn').onclick = () => { audio(); startRoom(nextRoom(), true); };
$('selectBtn').onclick = () => { audio(); showSelect(); };
$('selBack').onclick = () => { $('selectScreen').hidden = true; if (!started) $('titleScreen').hidden = false; };
$('clearMenu').onclick = showSelect;
$('menuBtn').onclick = () => { $('soundBtn').textContent = save.sound ? '소리 끄기' : '소리 켜기'; $('menuScreen').hidden = false; };
$('resumeBtn').onclick = () => $('menuScreen').hidden = true;
$('restartBtn').onclick = () => startRoom(cur, false);
$('menuSelect').onclick = showSelect;
$('soundBtn').onclick = () => { save.sound = !save.sound; persist(); $('soundBtn').textContent = save.sound ? '소리 끄기' : '소리 켜기'; };

/* hints: one more every 2 minutes in the room */
const HINT_STEP = 120;
let hintsShown = 1, hintTimer = 0;
function drawHints() {
  const hs = ROOMS[cur].hints; $('hintList').innerHTML = hs.slice(0, hintsShown).map((t, i) => '<p><b>' + (i + 1) + '</b>' + t + '</p>').join('');
  const more = $('moreHint'); more.hidden = hintsShown >= hs.length;
  const left = hintsShown * HINT_STEP - Math.floor((Date.now() - startTime) / 1000);
  more.disabled = left > 0; more.style.opacity = left > 0 ? .45 : 1;
  more.textContent = left > 0 ? '다음 힌트까지 ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : '다음 힌트 보기';
  clearTimeout(hintTimer); if (!more.hidden && left > 0 && !$('hintScreen').hidden) hintTimer = setTimeout(drawHints, 1000);
}
$('hintBtn').onclick = () => { $('hintScreen').hidden = false; drawHints(); };
$('moreHint').onclick = () => { if ((Date.now() - startTime) / 1000 < hintsShown * HINT_STEP) return; hintsShown++; drawHints(); };
$('hintClose').onclick = () => $('hintScreen').hidden = true;

let started = false;
fit();
{ const r = nextRoom(); cur = r; F = {}; inv = []; view = 0; render(); drawInv(); }
const _sr = startRoom; startRoom = function (i, r) { started = true; _sr(i, r); };
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
